<style>
/* Layout: the app's own look (Geist, blue-grey canvas, white cards, brand blue, green/red money) on a marketing page, with glass, blur and light glows. Mobile-first: bottom-sheet checkout, swipeable plans, sticky CTA. Light-only by choice. */
:root {
  --canvas: oklch(0.982 0.003 255);
  --card: oklch(1 0 0);
  --ink: oklch(0.145 0 0);
  --muted: oklch(0.556 0 0);
  --border: oklch(0.925 0.004 255);
  --brand: oklch(0.52 0.13 255);
  --brand-deep: oklch(0.42 0.13 258);
  --brand-glow: oklch(0.72 0.12 245);
  --positive: oklch(0.5 0.13 152);
  --negative: oklch(0.55 0.19 25);
  --warning: #b77900;
  --night: oklch(0.155 0.006 255);
  --sans: "Geist", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, Consolas, monospace;
  --r: 14px;
  --shadow: 0 1px 2px 0 rgb(15 23 42 / .04), 0 4px 14px -6px rgb(15 23 42 / .08);
  --shadow-lg: 0 1px 2px rgb(15 23 42 / .05), 0 24px 60px -24px rgb(15 23 42 / .28);
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
[id] { scroll-margin-top: 76px; }
@media (max-width: 420px) { .nav-cta { padding: 9px 12px; font-size: .8rem; min-height: 38px; } .logo-text { font-size: .86rem; } .logo { gap: 8px; } .nav .wrap { gap: 6px; } }
@media (max-width: 350px) { .logo-text { display: none; } }
body { background: var(--canvas); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.55; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
body.locked { overflow: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--canvas); }
a { color: var(--brand); text-decoration: none; }
p { margin: 0; }
button { font-family: inherit; }
h1, h2, h3 { margin: 0; letter-spacing: -0.035em; line-height: 1.05; text-wrap: balance; font-weight: 700; }
h1 { font-size: clamp(2.35rem, 6.6vw, 4.8rem); }
h2 { font-size: clamp(1.75rem, 4.4vw, 3.1rem); }
h3 { font-size: 1.15rem; letter-spacing: -0.02em; line-height: 1.25; font-weight: 600; }
.pos { color: var(--positive); }
.neg { color: var(--negative); }
.mutedt { color: var(--muted); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.section { padding-block: clamp(64px, 10vw, 120px); position: relative; }
.pt0 { padding-top: 0 !important; }
.head { display: grid; gap: 14px; justify-items: center; text-align: center; margin: 0 auto clamp(32px, 6vw, 60px); max-width: 760px; }
.head p { color: var(--muted); font-size: clamp(1rem, 1.8vw, 1.2rem); max-width: 54ch; }
.chip { display: inline-flex; align-items: center; gap: 8px; font-size: .8rem; font-weight: 500; color: var(--brand); background: color-mix(in oklch, var(--brand) 9%, white); border: 1px solid color-mix(in oklch, var(--brand) 18%, white); padding: 5px 12px; border-radius: 999px; justify-self: start; }
.head .chip { justify-self: center; }
.chip i { width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
:focus-visible { outline: 3px solid color-mix(in oklch, var(--brand) 50%, transparent); outline-offset: 3px; }

/* Buttons */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 .98rem/1 var(--sans); padding: 14px 22px; min-height: 48px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease, background .18s ease, opacity .18s ease; }
.btn-primary { overflow: hidden; color: #fff; background: linear-gradient(180deg, color-mix(in oklch, var(--brand) 88%, white), var(--brand)); box-shadow: 0 1px 0 rgb(255 255 255 / .25) inset, 0 8px 22px -8px color-mix(in oklch, var(--brand) 70%, transparent); }
.btn-primary::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgb(255 255 255 / .38) 50%, transparent 65%); transform: translateX(-130%); pointer-events: none; }
.btn-ghost { background: rgb(255 255 255 / .7); color: var(--ink); border: 1px solid var(--border); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.btn-soft { background: var(--canvas); color: var(--ink); border: 1px solid var(--border); }
.btn-sm { padding: 10px 16px; min-height: 40px; font-size: .88rem; border-radius: 10px; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .42; cursor: not-allowed; box-shadow: none; transform: none; }
.btn:disabled::after { display: none; }
@media (hover: hover) {
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 1px 0 rgb(255 255 255 / .25) inset, 0 14px 30px -10px color-mix(in oklch, var(--brand) 80%, transparent); }
  .btn-ghost:hover, .btn-soft:hover { background: #fff; }
}
.linkbtn { font: 600 .9rem/1 var(--sans); background: none; border: 0; color: var(--brand); cursor: pointer; padding: 8px 0; white-space: nowrap; }
.linkbtn:hover { text-decoration: underline; }
.cta-inline { display: flex; flex-wrap: wrap; gap: 10px 16px; justify-content: center; align-items: center; margin-top: 28px; font-size: .85rem; color: var(--muted); }
.cta-inline.left { margin-top: 6px; }
@media (max-width: 760px) { .cta-inline { flex-direction: column; gap: 8px; } .cta-inline .btn { width: 100%; } }
/* Every section title, chip and intro centred */
.loss-copy, .how > div:first-child, .founder, .loyal > div:first-child { text-align: center; justify-items: center; }
.chip { justify-self: center !important; }
.steps { justify-self: center; max-width: 460px; text-align: left; }
.founder .sig { justify-content: center; }

/* Logo */
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink); white-space: nowrap; }
.logo-mark { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, #2f6fc0, #4b3fa6); display: grid; place-items: center; color: #fff; font: 800 .72rem/1 "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -0.03em; box-shadow: 0 6px 16px -6px rgb(75 63 166 / .7), inset 0 1px 0 rgb(255 255 255 / .25); flex: none; }
.logo-mark.sm { width: 24px; height: 24px; border-radius: 7px; font-size: .56rem; }

/* Nav */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgb(255 255 255 / .62); backdrop-filter: saturate(180%) blur(18px); -webkit-backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid rgb(15 23 42 / .06); }
.nav .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 60px; }
.nav-links { display: flex; gap: 26px; font-size: .9rem; }
.nav-links a { color: var(--muted); font-weight: 500; }
.nav-links a:hover { color: var(--ink); }
.nav-right { display: flex; align-items: center; gap: 8px; }
.burger { display: none; width: 44px; height: 44px; border: 0; background: none; border-radius: 10px; cursor: pointer; place-items: center; color: var(--ink); }
.menu { position: absolute; left: var(--gutter-l); right: var(--gutter-r); top: calc(100% + 8px); background: rgb(255 255 255 / .9); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 8px; display: grid; }
.menu a { padding: 14px 14px; border-radius: 10px; color: var(--ink); font-weight: 500; }
.menu a:active { background: var(--canvas); }
@media (max-width: 760px) {
  .nav-links { display: none; }
  .burger { display: grid; }
  .logo-text { font-size: .95rem; }
}

/* Hero */
.hero { position: relative; overflow: hidden; padding-block: clamp(44px, 9vw, 110px) clamp(48px, 8vw, 96px); }
.aurora { position: absolute; inset: -20% -10% auto; height: 900px; pointer-events: none; z-index: 0; }
.aurora span { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.aurora .a1 { width: 620px; height: 620px; left: 8%; top: 0; background: color-mix(in oklch, var(--brand) 55%, white); }
.aurora .a2 { width: 520px; height: 520px; right: 6%; top: 80px; background: oklch(0.85 0.09 205); }
.aurora .a3 { width: 420px; height: 420px; left: 42%; top: 300px; background: oklch(0.88 0.08 290); opacity: .45; }
.grid-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgb(15 23 42 / .045) 1px, transparent 1px), linear-gradient(90deg, rgb(15 23 42 / .045) 1px, transparent 1px); background-size: 56px 56px; -webkit-mask-image: radial-gradient(ellipse 70% 55% at 50% 30%, #000 30%, transparent 75%); mask-image: radial-gradient(ellipse 70% 55% at 50% 30%, #000 30%, transparent 75%); }
.hero .wrap { position: relative; z-index: 1; }
.hero-copy { display: grid; gap: 20px; justify-items: center; text-align: center; }
.hero-copy .chip { justify-self: center; }
.grad { background: linear-gradient(100deg, var(--brand-deep), var(--brand) 45%, oklch(0.62 0.12 220)); background-size: 220% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; }
.hero .sub { font-size: clamp(1.05rem, 2vw, 1.3rem); color: var(--muted); max-width: 46ch; }
.ctas { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.fine { font-size: .85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; }
.fine span::before { content: "✓ "; color: var(--positive); font-weight: 700; }
@media (max-width: 760px) {
  .aurora { height: 620px; }
  .aurora span { filter: blur(60px); }
  .aurora .a1 { width: 340px; height: 340px; left: -60px; }
  .aurora .a2 { width: 300px; height: 300px; right: -80px; }
  .aurora .a3 { width: 260px; height: 260px; left: 30%; top: 260px; }
  .ctas { width: 100%; }
  .ctas .btn { flex: 1 1 100%; }
}

/* Product mock */
.stage { position: relative; margin-top: clamp(40px, 7vw, 76px); perspective: 1600px; }
.glass-frame { position: relative; border-radius: 22px; padding: 10px; background: rgb(255 255 255 / .45); border: 1px solid rgb(255 255 255 / .8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow-lg); transform-origin: 50% 0; }
.app { background: var(--canvas); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; display: grid; grid-template-columns: 190px 1fr; }
.app-side { background: var(--card); border-right: 1px solid var(--border); padding: 16px 12px; display: grid; gap: 4px; align-content: start; font-size: .82rem; }
.app-side .brandrow { display: flex; align-items: center; gap: 8px; font-weight: 700; padding: 4px 8px 14px; letter-spacing: -0.01em; }
.app-side .it { padding: 8px 10px; border-radius: 8px; color: var(--muted); font-weight: 500; }
.app-side .it.on { background: color-mix(in oklch, var(--brand) 9%, white); color: var(--brand); }
.app-main { padding: 18px; display: grid; gap: 14px; align-content: start; min-width: 0; }
.app-top { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.app-top h4 { margin: 0; font-size: 1.15rem; letter-spacing: -0.02em; }
.seg-mini { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 9px; padding: 3px; font-size: .75rem; }
.seg-mini span { padding: 5px 10px; border-radius: 6px; color: var(--muted); }
.seg-mini span.on { background: var(--canvas); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.stat .lab { display: flex; justify-content: space-between; align-items: center; gap: 6px; font-size: .72rem; color: var(--muted); font-weight: 500; }
.ic { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: .7rem; font-weight: 700; flex: none; }
.ic.b { background: color-mix(in oklch, var(--brand) 11%, white); color: var(--brand); }
.ic.p { background: color-mix(in oklch, var(--positive) 12%, white); color: var(--positive); }
.ic.n { background: color-mix(in oklch, var(--negative) 12%, white); color: var(--negative); }
.stat .val { font-size: clamp(.95rem, 2vw, 1.35rem); font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stat .hint { font-size: .7rem; color: var(--muted); margin-top: 2px; }
.stat.feat { background: color-mix(in oklch, var(--positive) 6%, white); border-color: color-mix(in oklch, var(--positive) 25%, white); }
.chart-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); }
.chart-card .t { display: flex; justify-content: space-between; font-size: .78rem; color: var(--muted); font-weight: 500; margin-bottom: 10px; }
.chart-card svg { display: block; width: 100%; height: 150px; }
.float { position: absolute; z-index: 2; width: 270px; border-radius: 18px; padding: 12px 14px; display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: center; background: rgb(255 255 255 / .72); border: 1px solid rgb(255 255 255 / .9); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); box-shadow: 0 18px 40px -16px rgb(15 23 42 / .3); }
.float .ico { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .85rem; }
.float .meta { display: flex; justify-content: space-between; font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
.float .msg { font-size: .82rem; font-weight: 500; }
.float .amt-big { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.float.f1 { left: -28px; top: 18%; }
.float.f2 { right: -28px; top: 52%; }
.stage-caption { text-align: center; color: var(--muted); font-size: .82rem; margin-top: 18px; }
@media (max-width: 1000px) {
  .floats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .float { position: static; width: auto; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; }
  .app-side { display: none; }
  .app-main { padding: 12px; gap: 10px; }
  .stats { grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { padding: 10px 11px; }
  .chart-card svg { height: 110px; }
  .glass-frame { padding: 6px; border-radius: 18px; }
  .float { padding: 10px; grid-template-columns: 28px 1fr; gap: 8px; border-radius: 14px; }
  .float .ico { width: 28px; height: 28px; border-radius: 8px; font-size: .75rem; }
  .float .ico svg { width: 18px; height: 18px; }
  .float .meta span:last-child { display: none; }
  .float .msg { font-size: .72rem; }
  .float .amt-big { font-size: 1.02rem; }
}

/* Marquee */
.marquee { overflow: hidden; margin-top: 40px; -webkit-mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); mask-image: linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent); }
.track { display: flex; gap: 44px; width: max-content; font-weight: 600; font-size: 1.05rem; color: oklch(0.62 0 0); letter-spacing: -0.01em; }
.track span { display: inline-flex; align-items: center; gap: 44px; white-space: nowrap; }
.track span::after { content: "•"; color: var(--brand); opacity: .5; }

/* Cards */
.card { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); padding: clamp(18px, 3vw, 28px); overflow: hidden; min-width: 0; }
.card.spot::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0; transition: opacity .3s ease; background: radial-gradient(420px circle at var(--mx, 50%) var(--my, 50%), color-mix(in oklch, var(--brand) 10%, transparent), transparent 60%); }
@media (hover: hover) { .card.spot:hover::before { opacity: 1; } }
.card > * { position: relative; }

/* Pain */
.pain-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.pain-grid .card { display: grid; gap: 10px; align-content: start; }
.pain-grid .q { font-size: 1.05rem; font-weight: 500; letter-spacing: -0.01em; line-height: 1.4; }
.pain-grid .tag { font-family: var(--mono); font-size: .72rem; color: var(--negative); }
.verdict { text-align: center; margin-top: 40px; font-size: clamp(1.35rem, 3vw, 2.1rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; }
.verdict span { color: var(--brand); }
@media (max-width: 860px) { .pain-grid { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) {
  .pain-grid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 12px; margin: 0 calc(-1 * var(--gutter-r)) 0 calc(-1 * var(--gutter-l)); padding: 4px var(--gutter-r) 12px var(--gutter-l); scrollbar-width: none; }
  .pain-grid::-webkit-scrollbar { display: none; }
  .pain-grid .card { flex: 0 0 78%; scroll-snap-align: center; }
}

/* Loss */
.loss-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(24px, 5vw, 56px); align-items: center; }
.loss-copy { display: grid; gap: 16px; min-width: 0; }
.loss-copy p { color: var(--muted); font-size: 1.08rem; }
.row { display: flex; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--border); font-size: .95rem; font-variant-numeric: tabular-nums; }
.row span:last-child { font-weight: 600; white-space: nowrap; }
.total-loss { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; padding-top: 18px; }
.total-loss small { display: block; color: var(--muted); font-size: .8rem; }
.total-loss .big { font-size: clamp(2.3rem, 6vw, 3.4rem); font-weight: 700; letter-spacing: -0.04em; color: var(--negative); font-variant-numeric: tabular-nums; line-height: 1; }
.note { font-size: .78rem; color: var(--muted); margin-top: 10px; }
@media (max-width: 820px) { .loss-wrap { grid-template-columns: 1fr; } .row { font-size: .9rem; } }

/* How */
.how { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(28px, 5vw, 64px); align-items: center; }
.steps { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; counter-reset: s; }
.steps li { display: grid; grid-template-columns: 36px 1fr; gap: 14px; align-items: start; }
.steps li::before { counter-increment: s; content: counter(s); width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: #fff; background: linear-gradient(135deg, var(--brand-glow), var(--brand-deep)); box-shadow: 0 6px 14px -6px color-mix(in oklch, var(--brand) 70%, transparent); }
.steps strong { display: block; font-size: 1.05rem; letter-spacing: -0.01em; }
.steps span { color: var(--muted); }
.receipt .rh { display: flex; justify-content: space-between; font-size: .75rem; color: var(--muted); font-family: var(--mono); padding-bottom: 10px; border-bottom: 1px dashed var(--border); }
.receipt .rt { display: flex; justify-content: space-between; align-items: baseline; padding-top: 14px; }
.receipt .rt b { font-size: 2.2rem; letter-spacing: -0.03em; color: var(--positive); }
@media (max-width: 820px) { .how { grid-template-columns: 1fr; } }

/* Bento */
.bento { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
.bento .card { display: grid; gap: 10px; align-content: start; }
.bento .s2 { grid-column: span 2; } .bento .s3 { grid-column: span 3; } .bento .s4 { grid-column: span 4; }
.bento p { color: var(--muted); font-size: .95rem; }
.ficon { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; }
.ficon svg { width: 18px; height: 18px; }
.roas { display: grid; gap: 8px; margin-top: 6px; }
.roas div { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; background: var(--canvas); border: 1px solid var(--border); border-radius: 10px; padding: 9px 12px; font-size: .88rem; font-variant-numeric: tabular-nums; }

/* Before / after */

/* Founder */

/* Segmented switch with glass pill */

.seg.block { display: grid; }
.seg .ind { position: absolute; top: 4px; bottom: 4px; left: 0; border-radius: 9px; background: linear-gradient(180deg, rgb(255 255 255 / .92), rgb(255 255 255 / .55)); border: 1px solid rgb(255 255 255 / .95); backdrop-filter: blur(12px) saturate(180%); -webkit-backdrop-filter: blur(12px) saturate(180%); box-shadow: inset 0 1px 0 #fff, inset 0 -1px 1px rgb(255 255 255 / .45), 0 6px 16px -8px rgb(15 23 42 / .35), 0 0 0 .5px rgb(15 23 42 / .06); transition: transform .5s cubic-bezier(.3,1.5,.4,1), width .5s cubic-bezier(.3,1.5,.4,1); z-index: 0; }

/* Pricing */

/* Loyalty */

@media (max-width: 340px) { .foot { grid-template-columns: 1fr; } }

/* Mobile sticky CTA */
.mcta { position: fixed; z-index: 25; left: 0; right: 0; bottom: 0; padding: 10px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l); background: rgb(255 255 255 / .78); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); border-top: 1px solid rgb(15 23 42 / .08); display: none; gap: 10px; transform: translateY(110%); transition: transform .35s cubic-bezier(.2,.8,.2,1); }

/* Modals */

.sheet { position: relative; width: 100%; max-width: 780px; max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain; background: var(--card); border-radius: 18px; border: 1px solid var(--border); box-shadow: 0 40px 100px -30px rgb(15 23 42 / .5); display: grid; grid-template-columns: 1fr 1.1fr; }

.sum { background: var(--canvas); border-right: 1px solid var(--border); padding: 20px; display: grid; gap: 11px; align-content: start; min-width: 0; }

.glass-plan { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; border-radius: 14px; background: linear-gradient(135deg, rgb(255 255 255 / .75), rgb(255 255 255 / .3)); border: 1px solid rgb(255 255 255 / .9); backdrop-filter: blur(18px) saturate(180%); -webkit-backdrop-filter: blur(18px) saturate(180%); box-shadow: inset 0 1px 0 rgb(255 255 255 / .95), inset 0 -1px 0 rgb(255 255 255 / .35), 0 14px 34px -16px color-mix(in oklch, var(--brand) 60%, transparent); }

/* Legal viewer */

.legal-body th { background: var(--canvas); font-weight: 600; }
.legal-body tr:last-child td { border-bottom: 0; }
.legal-body code { font-family: var(--mono); font-size: .8rem; background: var(--canvas); padding: 1px 5px; border-radius: 5px; }
mark.pend { background: #fff3c4; color: #7a5a00; padding: 0 3px; border-radius: 4px; }
@media (max-width: 760px) {
  .legal-sheet { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: calc(100dvh - 24px - env(safe-area-inset-top, 0px)); }
  .legal-nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 10px var(--gutter-r) 10px var(--gutter-l); gap: 6px; scrollbar-width: none; }

  .legal-doc h2 { font-size: 1.35rem; }

/* Cookie banner */
.cookie { position: fixed; z-index: 35; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(440px, calc(100vw - 32px)); background: rgb(255 255 255 / .9); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 16px; display: grid; gap: 12px; font-size: .84rem; color: oklch(0.3 0 0); }
.cookie a { font-weight: 600; }
.cookie-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cookie-btns .btn { padding: 9px 8px; font-size: .8rem; min-height: 40px; }

@media (hover: hover) { .btn-dark:hover { background: oklch(0.28 0 0); } }

.tgl { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); cursor: pointer; }
.tgl span { display: grid; gap: 1px; }

.tgl input { appearance: none; -webkit-appearance: none; width: 40px; height: 24px; border-radius: 99px; background: oklch(0.88 0.005 255); position: relative; flex: none; cursor: pointer; transition: background .2s ease; margin: 0; }
.tgl input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgb(0 0 0 / .25); transition: transform .25s cubic-bezier(.3,1.4,.4,1); }

@media (max-width: 760px) { .cookie { left: 8px; right: 8px; width: auto; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); } .cookie-btns .btn { min-height: 44px; } }
@media (prefers-reduced-motion: no-preference) { .cookie { animation: fadeUp .5s .6s cubic-bezier(.2,.8,.2,1) both; } }

/* Calculator */
.calc { display: grid; grid-template-columns: 1.1fr .9fr; gap: 0; padding: 0 !important; max-width: 1000px; margin: 0 auto; }

@media (max-width: 760px) { .calc-in .fld input { font-size: 16px; min-height: 46px; } .calc-out .btn { width: 100%; } }

.cmp { max-width: 1000px; margin: 0 auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }

<script type="application/json" id="legal-data">{"aviso":{"title":"Aviso legal","html":"<p><em>Última actualización: <mark class=\"pend\">[PENDIENTE: fecha de publicación]<\/mark><\/em><\/p>\n<h2>1. Titular del sitio web<\/h2>\n<p>En cumplimiento del artículo 10 de la Ley 34/2002, de Servicios de la Sociedad de la Información y de Comercio\nElectrónico (LSSI-CE), se informa de los datos del titular de este sitio web y del servicio LOOSES &amp; WINS:<\/p>\n<ul>\n<li><strong>Titular:<\/strong> <mark class=\"pend\">[PENDIENTE: nombre y apellidos o razón social]<\/mark><\/li>\n<li><strong>NIF / CIF:<\/strong> <mark class=\"pend\">[PENDIENTE]<\/mark><\/li>\n<li><strong>Domicilio:<\/strong> <mark class=\"pend\">[PENDIENTE: dirección completa]<\/mark><\/li>\n<li><strong>Correo electrónico de contacto:<\/strong> <mark class=\"pend\">[PENDIENTE: p. ej. <a href=\"mailto:hola@dominio.com\">hola@dominio.com<\/a>]<\/mark><\/li>\n<li><strong>Datos registrales:<\/strong> <mark class=\"pend\">[PENDIENTE: Registro Mercantil, tomo, folio, hoja — solo si es una sociedad]<\/mark><\/li>\n<\/ul>\n<p>En adelante, «LOOSES &amp; WINS», «nosotros» o «el titular».<\/p>\n<h2>2. Objeto<\/h2>\n<p>Este sitio web presenta y comercializa LOOSES &amp; WINS, un software en la nube (SaaS) de contabilidad y cálculo del\nbeneficio real para tiendas online. El uso del servicio contratado se rige por las\n<a href=\"#legal-condiciones\">Condiciones de uso<\/a>. Este aviso legal regula el uso del sitio web.<\/p>\n<h2>3. Condiciones de uso del sitio web<\/h2>\n<p>Acceder al sitio web implica aceptar este aviso legal. Te comprometes a:<\/p>\n<ul>\n<li>Usar el sitio de forma lícita y de buena fe.<\/li>\n<li>No intentar acceder a zonas restringidas, alterar su funcionamiento ni introducir código malicioso.<\/li>\n<li>No usar los contenidos con fines ilícitos o que perjudiquen a terceros o al titular.<\/li>\n<\/ul>\n<h2>4. Propiedad intelectual e industrial<\/h2>\n<p>Los textos, diseños, gráficos, logotipos, código fuente y demás elementos del sitio y del software son titularidad de\nLOOSES &amp; WINS o se usan con licencia. Queda prohibida su reproducción, distribución, comunicación pública o\ntransformación sin autorización expresa.<\/p>\n<p>Las marcas de terceros que aparecen en el sitio (por ejemplo, Shopify, Meta, TikTok, Google, AliExpress, PayPal,\nRevolut o Wise) pertenecen a sus respectivos titulares y se citan únicamente para indicar con qué servicios se puede\nconectar LOOSES &amp; WINS. Su mención no implica patrocinio, asociación ni respaldo por su parte.<\/p>\n<h2>5. Ejemplos y cifras<\/h2>\n<p>Las cifras, pedidos, campañas y pantallas que aparecen en el sitio web son <strong>ejemplos ilustrativos<\/strong>. No son resultados\nde clientes ni garantizan ningún resultado económico.<\/p>\n<h2>6. Responsabilidad<\/h2>\n<p>El titular trabaja para que el sitio esté disponible y sus contenidos sean correctos, pero no garantiza la ausencia de\ninterrupciones o errores. No responde de los daños derivados del uso indebido del sitio, de causas ajenas a su control\nni de los contenidos de sitios de terceros enlazados.<\/p>\n<h2>7. Enlaces a terceros<\/h2>\n<p>Los enlaces a sitios de terceros se ofrecen solo como referencia. El titular no controla esos sitios ni responde de\nsus contenidos o políticas.<\/p>\n<h2>8. Protección de datos y cookies<\/h2>\n<p>El tratamiento de datos personales se explica en la <a href=\"#legal-privacidad\">Política de privacidad<\/a> y el uso de cookies, en\nla <a href=\"#legal-cookies\">Política de cookies<\/a>.<\/p>\n<h2>9. Legislación aplicable y jurisdicción<\/h2>\n<p>Este aviso legal se rige por la legislación española. Para cualquier controversia, las partes se someten a los juzgados\ny tribunales de <mark class=\"pend\">[PENDIENTE: ciudad]<\/mark>, salvo que la ley establezca otro fuero (por ejemplo, el del domicilio del\nconsumidor).<\/p>\n"},"condiciones":{"title":"Condiciones de uso","html":"<p><em>Última actualización: <mark class=\"pend\">[PENDIENTE: fecha de publicación]<\/mark><\/em><\/p>\n<p>Estas condiciones regulan la contratación y el uso de LOOSES &amp; WINS (el «Servicio»), prestado por\n<mark class=\"pend\">[PENDIENTE: titular, NIF y domicilio]<\/mark> («nosotros»). Al crear una cuenta o contratar un plan aceptas estas condiciones,\nla <a href=\"#legal-devoluciones\">Política de devoluciones<\/a>, la <a href=\"#legal-pagos\">Política de pagos y contracargos<\/a> y el\n<a href=\"#legal-encargo\">Acuerdo de encargo del tratamiento<\/a>. Lee también la <a href=\"#legal-privacidad\">Política de privacidad<\/a>.<\/p>\n<h2>1. Qué es el Servicio<\/h2>\n<p>LOOSES &amp; WINS es un software en la nube que cruza los datos de tus tiendas y de los servicios que conectes (por ejemplo,\nShopify, tu proveedor, plataformas de anuncios, pasarelas de pago o bancos) para calcular el beneficio real por pedido,\nproducto, campaña, tienda y día, y para ayudarte a organizar facturas, impuestos y el cierre de mes.<\/p>\n<p>El Servicio está dirigido principalmente a <strong>empresas y profesionales<\/strong> (autónomos y sociedades) que venden online.<\/p>\n<h2>2. Cuenta<\/h2>\n<ul>\n<li>Para usar el Servicio necesitas una cuenta con un e-mail válido. Los datos que nos des deben ser veraces.<\/li>\n<li>Eres responsable de guardar tus credenciales y de la actividad de tu cuenta y de los usuarios que invites.<\/li>\n<li>Debes activar las medidas de seguridad disponibles (por ejemplo, la verificación en dos pasos) cuando lo consideres\nnecesario. Avísanos si sospechas un acceso no autorizado.<\/li>\n<\/ul>\n<h2>3. Planes y precios<\/h2>\n<ul>\n<li><strong>Plan Gratis:<\/strong> 1 tienda, hasta 50 pedidos al mes y 30 días de historial. Sin tarjeta. Podemos modificar o retirar el\nplan gratuito avisando con antelación razonable.<\/li>\n<li><strong>Planes de pago<\/strong> (Starter, Growth y Scale): con los límites de tiendas, pedidos, facturas y usuarios publicados en la\nweb en el momento de la contratación. Se pagan de forma <strong>mensual o anual<\/strong>, por adelantado.<\/li>\n<li><strong>Enterprise:<\/strong> condiciones y precio a medida, por presupuesto.<\/li>\n<li><strong>Precios sin IVA.<\/strong> El IVA u otros impuestos aplicables se añaden en el pago según tu país y tus datos fiscales.<\/li>\n<li><strong>Límites:<\/strong> si superas de forma continuada el límite de pedidos de tu plan, te avisaremos y podremos pasarte al plan\nsiguiente a partir del siguiente periodo de facturación, previo aviso.<\/li>\n<\/ul>\n<h2>4. Precio congelado y descuento por antigüedad<\/h2>\n<ul>\n<li>Mientras tu suscripción siga activa sin interrupción, <strong>mantenemos el precio de tu plan<\/strong> aunque cambiemos las tarifas\npara nuevos clientes.<\/li>\n<li>Con la suscripción activa y sin interrupción, se aplica un descuento por antigüedad sobre el precio del plan:\n<strong>−5 % a partir de los 6 meses, −10 % a partir de 1 año y −15 % a partir de 2 años<\/strong>.<\/li>\n<li>Si cancelas y vuelves a contratar, la antigüedad empieza de cero y se aplican las tarifas vigentes en ese momento.<\/li>\n<li>El descuento por antigüedad no se acumula con otras promociones salvo que se indique lo contrario.<\/li>\n<\/ul>\n<h2>5. Códigos de descuento y promociones<\/h2>\n<p>Los códigos de descuento tienen las condiciones que se indiquen en cada promoción (importe o porcentaje, planes a los\nque se aplican, número de usos, duración y fecha de caducidad). Salvo que se diga otra cosa, un código se aplica solo al\nprimer pago. No son canjeables por dinero.<\/p>\n<h2>6. Asistente IA (opcional)<\/h2>\n<ul>\n<li>El asistente IA es un complemento opcional con una cantidad de créditos al mes según la modalidad (Básico o Pro). Los\ncréditos del mes no se acumulan al mes siguiente. Si se agotan, puedes comprar packs adicionales.<\/li>\n<li>Las respuestas del asistente se generan automáticamente a partir de tus datos y <strong>pueden contener errores<\/strong>. No son\nasesoramiento fiscal, contable, legal ni financiero. Revisa la información antes de tomar decisiones.<\/li>\n<li>Para generar las respuestas, los datos necesarios se envían a un proveedor de inteligencia artificial que actúa como\nsubencargado del tratamiento (ver <a href=\"#legal-encargo\">Acuerdo de encargo del tratamiento<\/a>).<\/li>\n<\/ul>\n<h2>7. Puesta en marcha («Te lo dejamos montado»)<\/h2>\n<p>Servicio opcional de configuración por videollamada: conexión de tus tiendas e importación de tu historial. Precio\npublicado en el momento de la contratación (149 €, o 49 € con un plan anual, sin IVA). Necesitamos tu colaboración y los\naccesos que tú autorices; no incluye trabajos de contabilidad ni de asesoría fiscal.<\/p>\n<h2>8. Conexiones con servicios de terceros<\/h2>\n<ul>\n<li>El Servicio se conecta, con tu autorización, a servicios de terceros (por ejemplo, Shopify, plataformas de anuncios,\npasarelas de pago, bancos, proveedores o Google Drive). El uso de esos servicios se rige por sus propias condiciones.<\/li>\n<li>Si un tercero cambia, limita o retira su API, algunas funciones pueden dejar de estar disponibles total o\nparcialmente. Haremos lo razonable para adaptarnos o ofrecer una alternativa manual, pero no respondemos de los\ncambios de terceros.<\/li>\n<li>Nunca te pediremos las contraseñas de tu proveedor ni de Google. Las claves de conexión se guardan cifradas.<\/li>\n<\/ul>\n<h2>9. Exactitud de los datos y responsabilidad fiscal<\/h2>\n<ul>\n<li>Los cálculos dependen de los datos que llegan de las conexiones y de los que introduces tú (costes, gastos, facturas).\nSi esos datos son incompletos o erróneos, los resultados también lo serán.<\/li>\n<li>Los informes de IVA, OSS y cierre de mes son una <strong>ayuda para preparar<\/strong> tus obligaciones. La presentación de\nimpuestos y la contabilidad oficial son responsabilidad tuya y de tu asesor.<\/li>\n<li>Los ejemplos y cifras de la web son ilustrativos y no garantizan ningún resultado económico.<\/li>\n<\/ul>\n<h2>10. Uso aceptable<\/h2>\n<p>No puedes usar el Servicio para actividades ilícitas, para vulnerar derechos de terceros, para intentar acceder a datos\nde otros clientes, para hacer ingeniería inversa del software ni para sobrecargar la plataforma de forma deliberada.<\/p>\n<h2>11. Disponibilidad y soporte<\/h2>\n<ul>\n<li>Trabajamos para que el Servicio esté disponible de forma continuada, pero puede haber interrupciones por\nmantenimiento, actualizaciones o causas ajenas (por ejemplo, caídas de proveedores o de internet). Avisaremos con\nantelación de los mantenimientos programados cuando sea posible.<\/li>\n<li>Salvo en los planes Enterprise con acuerdo de nivel de servicio, no se garantiza una disponibilidad concreta.<\/li>\n<li>Soporte por <mark class=\"pend\">[PENDIENTE: canal de soporte, p. ej. e-mail o chat]<\/mark> en horario de <mark class=\"pend\">[PENDIENTE]<\/mark>. Los planes Scale y\nEnterprise tienen soporte prioritario.<\/li>\n<\/ul>\n<h2>12. Tus datos<\/h2>\n<ul>\n<li>Los datos de tu negocio son tuyos. Nuestro equipo solo accede a lo imprescindible para que tu cuenta funcione y para\nfacturarte, y solo accederá a tu información de negocio para darte soporte cuando tú lo solicites. Cada acceso de\nsoporte queda registrado y visible en tu cuenta.<\/li>\n<li>Respecto a los datos de tu negocio y de tus clientes, actuamos como <strong>encargado del tratamiento<\/strong> según el\n<a href=\"#legal-encargo\">Acuerdo de encargo del tratamiento<\/a>, que forma parte de estas condiciones.<\/li>\n<li>Podemos usar estadísticas <strong>agregadas y anónimas<\/strong> del uso del Servicio para mejorarlo, sin identificarte a ti ni a tu\nnegocio.<\/li>\n<\/ul>\n<h2>13. Duración, cancelación y conservación de datos<\/h2>\n<ul>\n<li>La suscripción se renueva automáticamente al final de cada periodo (mes o año) hasta que la canceles.<\/li>\n<li>Puedes cancelar en cualquier momento desde tu cuenta, con un clic. La cancelación evita la siguiente renovación; el\nServicio sigue activo hasta el final del periodo ya pagado.<\/li>\n<li>Tras la baja, <strong>conservamos tus datos durante dos meses<\/strong> por si vuelves. Durante ese plazo puedes reactivar tu cuenta\no pedir la exportación de tus datos. Pasado ese plazo se eliminan, salvo los que debamos conservar por obligación legal\n(por ejemplo, nuestras facturas).<\/li>\n<li>Lo pagado no se reembolsa, salvo en los casos de la <a href=\"#legal-devoluciones\">Política de devoluciones<\/a>.<\/li>\n<\/ul>\n<h2>14. Suspensión y resolución<\/h2>\n<p>Podemos suspender o cerrar una cuenta, con aviso previo cuando sea posible, si se incumplen estas condiciones o si\nexiste un uso fraudulento. En caso de impago se aplica el apartado 3 de la\n<a href=\"#legal-pagos\">Política de pagos y contracargos<\/a>: bloqueo a los 3 días, recargo por demora y borrado de la cuenta a los\n30 días. En el caso concreto de los contracargos se aplica la\n<a href=\"#legal-pagos\">Política de pagos y contracargos<\/a>.<\/p>\n<h2>15. Propiedad intelectual<\/h2>\n<p>El software, su diseño y su documentación son de nuestra titularidad. Te concedemos una licencia de uso no exclusiva e\nintransferible mientras tu suscripción esté activa. No adquieres ningún derecho sobre el software.<\/p>\n<h2>16. Limitación de responsabilidad<\/h2>\n<ul>\n<li>No respondemos de las decisiones de negocio, fiscales o de inversión publicitaria que tomes con la información del\nServicio, ni del lucro cesante, la pérdida de beneficios o los daños indirectos.<\/li>\n<li>Nuestra responsabilidad total frente a ti por cualquier causa se limita al importe que nos hayas pagado en los\n<strong>12 meses anteriores<\/strong> al hecho que la origine.<\/li>\n<li>Estas limitaciones no se aplican en los casos de dolo o culpa grave ni cuando la ley no permita limitarlas, incluidos\nlos derechos que la normativa de consumo reconozca a los consumidores.<\/li>\n<\/ul>\n<h2>17. Cambios en las condiciones<\/h2>\n<p>Podemos modificar estas condiciones. Te avisaremos por e-mail o en la app con al menos <strong>30 días<\/strong> de antelación si los\ncambios son relevantes. Si no estás de acuerdo, puedes cancelar antes de que entren en vigor.<\/p>\n<h2>18. Consumidores<\/h2>\n<p>Si contratas como consumidor (sin actividad empresarial o profesional), conservas todos los derechos que te reconoce el\nReal Decreto Legislativo 1/2007 (Ley General para la Defensa de los Consumidores y Usuarios). En particular, consulta el\nderecho de desistimiento en la <a href=\"#legal-devoluciones\">Política de devoluciones<\/a>.<\/p>\n<h2>19. Ley aplicable y jurisdicción<\/h2>\n<p>Estas condiciones se rigen por la legislación española. Si contratas como empresa o profesional, las partes se someten\na los juzgados y tribunales de <mark class=\"pend\">[PENDIENTE: ciudad]<\/mark>. Si eres consumidor, serán competentes los de tu domicilio.<\/p>\n<h2>20. Contacto<\/h2>\n<p><mark class=\"pend\">[PENDIENTE: e-mail de contacto y dirección postal]<\/mark><\/p>\n"},"devoluciones":{"title":"Política de devoluciones","html":"<p><em>Última actualización: <mark class=\"pend\">[PENDIENTE: fecha de publicación]<\/mark><\/em><\/p>\n<p>Esta política forma parte de las <a href=\"#legal-condiciones\">Condiciones de uso<\/a>.<\/p>\n<h2>1. Regla general: lo pagado no se reembolsa<\/h2>\n<p>LOOSES &amp; WINS es un servicio digital que empieza a funcionar en el momento en que contratas: tu cuenta se activa, se\nconectan tus tiendas y se procesan tus datos. Por eso, <strong>una vez realizado un pago, no se reembolsa<\/strong>, ni total ni\nparcialmente, tampoco por la parte no usada de un periodo mensual o anual.<\/p>\n<p>Para que puedas comprobar si el Servicio te encaja <strong>antes de pagar<\/strong>, tienes el plan Gratis, sin tarjeta y sin límite de\ntiempo.<\/p>\n<h2>2. Cancelación<\/h2>\n<ul>\n<li>Puedes cancelar tu suscripción cuando quieras, con un clic desde tu cuenta.<\/li>\n<li>La cancelación <strong>evita la siguiente renovación<\/strong>. Mantienes el acceso hasta el final del periodo ya pagado.<\/li>\n<li>No hay permanencia ni penalización por cancelar.<\/li>\n<\/ul>\n<h2>3. Casos en los que sí devolvemos el dinero<\/h2>\n<ul>\n<li><strong>Cobros duplicados<\/strong> por un error técnico.<\/li>\n<li><strong>Cobros posteriores a una cancelación<\/strong> hecha correctamente antes de la renovación.<\/li>\n<li><strong>Cobros de un importe distinto<\/strong> al que aceptaste en el pago.<\/li>\n<li>Cuando la ley lo exija.<\/li>\n<\/ul>\n<p>Escríbenos a <mark class=\"pend\">[PENDIENTE: e-mail de soporte]<\/mark> indicando el e-mail de tu cuenta y el cobro. Respondemos en un plazo máximo\nde <mark class=\"pend\">[PENDIENTE: p. ej. 5 días hábiles]<\/mark>. Si procede, el reembolso se hace al mismo medio de pago.<\/p>\n<h2>4. Puesta en marcha («Te lo dejamos montado»)<\/h2>\n<p>El servicio de puesta en marcha no se reembolsa una vez realizada la videollamada de configuración. Si no se ha\nrealizado y lo cancelas con al menos <mark class=\"pend\">[PENDIENTE: p. ej. 48 horas]<\/mark> de antelación sobre la cita, te devolvemos su importe.<\/p>\n<h2>5. Consumidores: derecho de desistimiento<\/h2>\n<p>Si contratas como <strong>consumidor<\/strong> (sin actividad empresarial o profesional), la ley te reconoce un derecho de\ndesistimiento de <strong>14 días naturales<\/strong> desde la contratación (artículos 102 y siguientes del Real Decreto Legislativo\n1/2007).<\/p>\n<p>Como el Servicio es un contenido y servicio digital que empieza a prestarse de inmediato, al contratar <strong>solicitas\nexpresamente que el servicio comience antes de que termine el plazo de desistimiento y reconoces que, una vez prestado\no iniciado con tu consentimiento, pierdes ese derecho<\/strong> (artículo 103, letras a) y m), del mismo texto legal).<\/p>\n<p><mark class=\"pend\">[PENDIENTE: revisar con el abogado si este consentimiento debe pedirse con una casilla propia en el pago para los\nconsumidores.]<\/mark><\/p>\n<h2>6. Contracargos<\/h2>\n<p>Si no estás de acuerdo con un cobro, <strong>escríbenos antes de abrir un contracargo<\/strong> con tu banco. Lo revisaremos y, si\nprocede, te devolveremos el dinero según esta política. Abrir un contracargo sin contactar antes con soporte tiene las\nconsecuencias descritas en la <a href=\"#legal-pagos\">Política de pagos y contracargos<\/a>.<\/p>\n"},"pagos":{"title":"Política de pagos y contracargos","html":"<p><em>Última actualización: <mark class=\"pend\">[PENDIENTE: fecha de publicación]<\/mark><\/em><\/p>\n<p>Esta política forma parte de las <a href=\"#legal-condiciones\">Condiciones de uso<\/a>. Al contratar un plan de pago la aceptas de\nforma expresa marcando su casilla en el proceso de pago.<\/p>\n<h2>1. Cómo se paga<\/h2>\n<ul>\n<li>Los pagos se procesan a través de <strong>Stripe<\/strong> <mark class=\"pend\">[PENDIENTE: confirmar proveedor de pagos]<\/mark>. Introduces tu tarjeta en la\npágina segura del proveedor de pagos; <strong>nosotros no vemos ni guardamos los datos completos de tu tarjeta<\/strong>.<\/li>\n<li>Las suscripciones se pagan <strong>por adelantado<\/strong> y se renuevan automáticamente al final de cada periodo (mensual o anual)\nhasta que las canceles.<\/li>\n<li>Te enviamos la factura de cada pago al e-mail de tu cuenta.<\/li>\n<\/ul>\n<h2>2. Impuestos<\/h2>\n<p>Los precios publicados no incluyen IVA. El impuesto se calcula en el pago según tu país y tus datos fiscales. Si eres\nuna empresa de otro país de la UE con NIF-IVA intracomunitario válido, se aplica la inversión del sujeto pasivo.<\/p>\n<h2>3. Pagos fallidos e impago<\/h2>\n<ol>\n<li><strong>Reintentos.<\/strong> Si un cobro falla, lo reintentaremos durante <strong>3 días<\/strong> y te avisaremos por e-mail para que puedas\nactualizar tu medio de pago.<\/li>\n<li><strong>Bloqueo.<\/strong> Si pasados esos 3 días no se ha podido cobrar, la cuenta queda <strong>bloqueada<\/strong>: no podrás usar el\nServicio y al entrar solo verás un <strong>aviso de impago<\/strong> con el importe pendiente y el botón para pagarlo. Las\nsincronizaciones se detienen.<\/li>\n<li><strong>Recargo por demora.<\/strong> Mientras dure el impago, el importe pendiente devenga un recargo que crece con el tiempo de\nretraso:<ul>\n<li>Si contratas como <strong>empresa o profesional<\/strong>: los <strong>intereses de demora<\/strong> de la Ley 3/2004, de lucha contra la\nmorosidad en las operaciones comerciales (tipo de interés del Banco Central Europeo más 8 puntos porcentuales,\ncalculado por días de retraso), más una <strong>indemnización de 40 €<\/strong> por costes de cobro (artículo 8 de esa ley).<\/li>\n<li>Si contratas como <strong>consumidor<\/strong>: el interés legal del dinero por los días de retraso.\n<mark class=\"pend\">[PENDIENTE: revisar con el abogado el recargo exacto aplicable.]<\/mark><\/li>\n<\/ul>\n<\/li>\n<li><strong>Reactivación.<\/strong> Si pagas el importe pendiente (y, en su caso, el recargo) antes de que pasen <strong>30 días<\/strong> desde el\nimpago, la cuenta se desbloquea al momento con todos sus datos.<\/li>\n<li><strong>Borrado.<\/strong> Pasados <strong>30 días desde el impago<\/strong> sin regularizarlo, se procederá a <strong>cancelar la cuenta y borrar todos\nsus datos<\/strong>. Te avisaremos por e-mail antes de hacerlo. Como responsable de los datos de tu negocio, eliges desde\nahora la supresión de los datos para este supuesto (artículo 28.3.g del RGPD). La deuda pendiente no se extingue con\nel borrado de la cuenta.<\/li>\n<\/ol>\n<h2>4. Cambios de precio<\/h2>\n<p>Los clientes con suscripción activa mantienen su precio (ver <a href=\"#legal-condiciones\">Condiciones de uso<\/a>, apartado 4).\nCualquier otro cambio de precio que te afecte se avisará con al menos <strong>30 días<\/strong> de antelación.<\/p>\n<h2>5. Si no estás de acuerdo con un cobro: contacta primero con nosotros<\/h2>\n<p>Si crees que un cobro es incorrecto, escríbenos a <mark class=\"pend\">[PENDIENTE: e-mail de soporte]<\/mark> <strong>antes de abrir una reclamación o\ncontracargo en tu banco<\/strong>. Revisaremos el caso y, si procede, te devolveremos el dinero según la\n<a href=\"#legal-devoluciones\">Política de devoluciones<\/a>. Es la forma más rápida de solucionarlo.<\/p>\n<h2>6. Contracargos sin contacto previo<\/h2>\n<p>Un contracargo es la reclamación que haces a tu banco para que anule un cobro. Abrir un contracargo <strong>sin haber\ncontactado antes con nuestro soporte<\/strong> se considera una actuación de mala fe y, al aceptar esta política, aceptas\nexpresamente estas consecuencias:<\/p>\n<ol>\n<li><strong>Bloqueo inmediato de la cuenta.<\/strong> Se cierran las sesiones, se detienen las sincronizaciones y se desconectan las\nintegraciones. No podrás acceder a la cuenta ni a sus datos, tampoco para exportarlos.<\/li>\n<li><strong>Borrado de todos los datos<\/strong> de la cuenta en un plazo de <mark class=\"pend\">[PENDIENTE: nº de días, propuesta 14]<\/mark> días desde la\napertura del contracargo. Durante ese plazo, al intentar entrar solo verás un aviso con la fecha de borrado.<\/li>\n<li><strong>Prohibición permanente<\/strong> de volver a contratar el Servicio, con cualquier cuenta.<\/li>\n<li>Como responsable de los datos de tu negocio, <strong>eliges desde ahora la supresión de los datos (y no su devolución)<\/strong>\npara este supuesto, a efectos del artículo 28.3.g del RGPD y del\n<a href=\"#legal-encargo\">Acuerdo de encargo del tratamiento<\/a>.<\/li>\n<\/ol>\n<p>Recuerda que los datos originales de tu negocio siguen en sus fuentes (tu tienda, tus pasarelas de pago, tus bancos y tu\nGoogle Drive): LOOSES &amp; WINS trabaja con copias de esos datos.<\/p>\n<h2>7. Datos que conservamos aunque se borre la cuenta<\/h2>\n<p>Para cumplir la ley y defendernos en la disputa, conservamos únicamente:<\/p>\n<ul>\n<li>Nuestras facturas emitidas y los datos de facturación, durante los plazos legales (por ejemplo, 6 años según el\nartículo 30 del Código de Comercio y los plazos de la normativa tributaria).<\/li>\n<li>La documentación de la disputa (registros de aceptación de esta política, de uso del Servicio y de comunicaciones),\nhasta que la disputa se resuelva y durante los plazos de prescripción de las acciones legales.<\/li>\n<li>Para hacer efectiva la prohibición del punto 6.3, una lista de exclusión con el <strong>e-mail, el NIF/CIF, los dominios de\nlas tiendas y una huella anónima de la tarjeta<\/strong> facilitada por el proveedor de pagos (no el número de la tarjeta),\ndurante <mark class=\"pend\">[PENDIENTE: plazo, p. ej. 5 años]<\/mark>, sobre la base de nuestro interés legítimo en prevenir el fraude.<\/li>\n<\/ul>\n<h2>8. Fraude<\/h2>\n<p>Si detectamos el uso de una tarjeta robada o de datos falsos, cancelaremos la cuenta de inmediato y colaboraremos con\nel proveedor de pagos y, si procede, con las autoridades.<\/p>\n"},"privacidad":{"title":"Política de privacidad","html":"<p><em>Última actualización: <mark class=\"pend\">[PENDIENTE: fecha de publicación]<\/mark><\/em><\/p>\n<h2>1. Responsable del tratamiento<\/h2>\n<ul>\n<li><strong>Responsable:<\/strong> <mark class=\"pend\">[PENDIENTE: nombre o razón social]<\/mark><\/li>\n<li><strong>NIF / CIF:<\/strong> <mark class=\"pend\">[PENDIENTE]<\/mark><\/li>\n<li><strong>Domicilio:<\/strong> <mark class=\"pend\">[PENDIENTE]<\/mark><\/li>\n<li><strong>E-mail para temas de privacidad:<\/strong> <mark class=\"pend\">[PENDIENTE: p. ej. <a href=\"mailto:privacidad@dominio.com\">privacidad@dominio.com<\/a>]<\/mark><\/li>\n<\/ul>\n<p>No estamos obligados a nombrar un delegado de protección de datos. Para cualquier consulta sobre tus datos, escríbenos\nal e-mail anterior.<\/p>\n<h2>2. A quién se aplica<\/h2>\n<ul>\n<li><strong>Visitantes<\/strong> de la web.<\/li>\n<li>Personas que nos <strong>piden presupuesto<\/strong> o nos escriben.<\/li>\n<li><strong>Clientes<\/strong> que crean una cuenta (gratuita o de pago) y los <strong>usuarios<\/strong> que invitan.<\/li>\n<\/ul>\n<p>Sobre los datos de tu negocio y de los clientes de tu tienda que tratamos al prestarte el Servicio, nosotros somos\n<strong>encargados del tratamiento<\/strong> y tú eres el responsable. Ese tratamiento se rige por el\n<a href=\"#legal-encargo\">Acuerdo de encargo del tratamiento<\/a>, no por esta política.<\/p>\n<h2>3. Qué datos tratamos, para qué y con qué base legal<\/h2>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Datos<\/th>\n<th>Finalidad<\/th>\n<th>Base legal<\/th>\n<th>Plazo de conservación<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>E-mail, nombre o empresa, contraseña cifrada, usuarios invitados<\/td>\n<td>Crear y gestionar tu cuenta<\/td>\n<td>Ejecución del contrato (art. 6.1.b RGPD)<\/td>\n<td>Mientras la cuenta exista y 2 meses tras la baja<\/td>\n<\/tr>\n<tr>\n<td>NIF/CIF, país, NIF-IVA, dirección de facturación, historial de pagos<\/td>\n<td>Cobrar y emitir facturas<\/td>\n<td>Ejecución del contrato y obligación legal (art. 6.1.b y c)<\/td>\n<td>Plazos legales mercantiles y tributarios (p. ej. 6 años)<\/td>\n<\/tr>\n<tr>\n<td>Datos del pago (los gestiona el proveedor de pagos; nosotros solo vemos el tipo de tarjeta y sus 4 últimos dígitos)<\/td>\n<td>Procesar el cobro<\/td>\n<td>Ejecución del contrato<\/td>\n<td>Según el proveedor de pagos<\/td>\n<\/tr>\n<tr>\n<td>Nombre, empresa, e-mail, teléfono, volumen de pedidos y franja horaria (formulario Enterprise)<\/td>\n<td>Llamarte y preparar un presupuesto<\/td>\n<td>Tu consentimiento y medidas precontractuales (art. 6.1.a y b)<\/td>\n<td>Hasta 12 meses si no contratas<\/td>\n<\/tr>\n<tr>\n<td>Mensajes a soporte<\/td>\n<td>Atender tu consulta<\/td>\n<td>Ejecución del contrato o interés legítimo<\/td>\n<td>Mientras dure la relación y los plazos de prescripción<\/td>\n<\/tr>\n<tr>\n<td>Registros de acceso y seguridad (IP, fecha, acciones en la cuenta, aceptaciones de condiciones)<\/td>\n<td>Seguridad, prevención de fraude y prueba de la contratación<\/td>\n<td>Interés legítimo (art. 6.1.f) y obligación legal<\/td>\n<td>Hasta <mark class=\"pend\">[PENDIENTE: p. ej. 12 meses]<\/mark>, salvo disputa abierta<\/td>\n<\/tr>\n<tr>\n<td>Lista de exclusión por contracargo (e-mail, NIF/CIF, dominios de tienda, huella anónima de tarjeta)<\/td>\n<td>Prevenir el fraude (ver <a href=\"#legal-pagos\">Política de pagos<\/a>)<\/td>\n<td>Interés legítimo (art. 6.1.f)<\/td>\n<td><mark class=\"pend\">[PENDIENTE: p. ej. 5 años]<\/mark><\/td>\n<\/tr>\n<tr>\n<td>E-mail para comunicaciones del producto (novedades, consejos)<\/td>\n<td>Enviarte comunicaciones comerciales sobre el Servicio<\/td>\n<td>Interés legítimo como cliente (art. 21.2 LSSI-CE) o consentimiento<\/td>\n<td>Hasta que te des de baja (enlace en cada e-mail)<\/td>\n<\/tr>\n<tr>\n<td>Datos de navegación y cookies<\/td>\n<td>Ver la <a href=\"#legal-cookies\">Política de cookies<\/a><\/td>\n<td>Consentimiento, salvo cookies técnicas<\/td>\n<td>Ver la política de cookies<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>No tomamos decisiones automatizadas con efectos jurídicos sobre ti ni elaboramos perfiles con ese fin.<\/p>\n<h2>4. A quién se comunican los datos<\/h2>\n<p>No vendemos tus datos. Solo los compartimos con proveedores que nos prestan servicios (encargados del tratamiento), con\ncontrato y garantías:<\/p>\n<ul>\n<li><strong>Alojamiento y base de datos:<\/strong> Supabase <mark class=\"pend\">[PENDIENTE: confirmar región, p. ej. UE – Fráncfort]<\/mark>.<\/li>\n<li><strong>Alojamiento de la web:<\/strong> <mark class=\"pend\">[PENDIENTE: proveedor de hosting de la web]<\/mark>.<\/li>\n<li><strong>Pagos:<\/strong> Stripe <mark class=\"pend\">[PENDIENTE: confirmar]<\/mark>.<\/li>\n<li><strong>Envío de e-mails:<\/strong> <mark class=\"pend\">[PENDIENTE: proveedor de e-mail transaccional]<\/mark>.<\/li>\n<li><strong>Asistente IA (solo si lo usas):<\/strong> Anthropic (modelos Claude).<\/li>\n<li><strong>Analítica y publicidad (solo si aceptas esas cookies):<\/strong> <mark class=\"pend\">[PENDIENTE: p. ej. Google, Meta]<\/mark>.<\/li>\n<\/ul>\n<p>También podremos comunicar datos a las administraciones públicas cuando la ley lo exija.<\/p>\n<h2>5. Transferencias internacionales<\/h2>\n<p>Algunos proveedores (por ejemplo, Stripe o Anthropic) pueden tratar datos fuera del Espacio Económico Europeo,\nprincipalmente en Estados Unidos. En esos casos, las transferencias se amparan en el Marco de Privacidad de Datos\nUE-EE. UU. cuando el proveedor está adherido, o en las cláusulas contractuales tipo aprobadas por la Comisión Europea.\n<mark class=\"pend\">[PENDIENTE: verificar el mecanismo de cada proveedor en su DPA.]<\/mark><\/p>\n<h2>6. Tus derechos<\/h2>\n<p>Puedes ejercer en cualquier momento tus derechos de <strong>acceso, rectificación, supresión, oposición, limitación del\ntratamiento y portabilidad<\/strong>, y retirar tu consentimiento cuando sea la base del tratamiento, escribiendo a\n<mark class=\"pend\">[PENDIENTE: e-mail de privacidad]<\/mark> e indicando qué derecho quieres ejercer. Responderemos en el plazo máximo de un mes.<\/p>\n<p>Si consideras que no hemos atendido bien tu solicitud, puedes reclamar ante la <strong>Agencia Española de Protección de\nDatos<\/strong> (<a href=\"http://www.aepd.es\">www.aepd.es<\/a>).<\/p>\n<h2>7. Seguridad<\/h2>\n<p>Aplicamos medidas técnicas y organizativas adecuadas: cifrado de las comunicaciones, cifrado de las claves de conexión\ncon servicios de terceros, control de accesos por cliente, verificación en dos pasos, copias de seguridad y registros\nde actividad. Nuestro equipo solo accede a la información de negocio de una cuenta para darte soporte cuando tú lo\nsolicitas, y ese acceso queda registrado.<\/p>\n<h2>8. Menores<\/h2>\n<p>El Servicio no está dirigido a menores de 18 años.<\/p>\n<h2>9. Cambios<\/h2>\n<p>Podemos actualizar esta política. Publicaremos la nueva versión con su fecha y, si los cambios son relevantes, te\navisaremos por e-mail o en la app.<\/p>\n"},"cookies":{"title":"Política de cookies","html":"<p><em>Última actualización: <mark class=\"pend\">[PENDIENTE: fecha de publicación]<\/mark><\/em><\/p>\n<h2>1. Qué son las cookies<\/h2>\n<p>Las cookies y tecnologías similares (como el almacenamiento local del navegador) son pequeños archivos que la web guarda\nen tu dispositivo para que funcione, recordar tus preferencias o medir y mejorar el servicio.<\/p>\n<h2>2. Qué cookies usamos<\/h2>\n<h3>Técnicas y de preferencias (siempre activas)<\/h3>\n<p>Son necesarias para que la web funcione y no requieren consentimiento (artículo 22.2 de la LSSI-CE).<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Nombre<\/th>\n<th>Titular<\/th>\n<th>Finalidad<\/th>\n<th>Duración<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><code>lw-consent<\/code><\/td>\n<td>LOOSES &amp; WINS<\/td>\n<td>Guardar tu elección sobre las cookies<\/td>\n<td>12 meses<\/td>\n<\/tr>\n<tr>\n<td><code>lw-period2<\/code><\/td>\n<td>LOOSES &amp; WINS<\/td>\n<td>Recordar si prefieres ver los precios anuales o mensuales<\/td>\n<td>Hasta que borres los datos del navegador<\/td>\n<\/tr>\n<tr>\n<td>Cookies de sesión de la app <mark class=\"pend\">[PENDIENTE: nombres exactos]<\/mark><\/td>\n<td>LOOSES &amp; WINS<\/td>\n<td>Mantener tu sesión iniciada en la app<\/td>\n<td>Sesión / según configuración<\/td>\n<\/tr>\n<tr>\n<td>Cookies del proveedor de pagos <mark class=\"pend\">[PENDIENTE: confirmar]<\/mark><\/td>\n<td>Stripe<\/td>\n<td>Seguridad y prevención del fraude durante el pago<\/td>\n<td>Según el proveedor<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>Analíticas (solo si las aceptas)<\/h3>\n<p>Nos ayudan a saber cuántas personas visitan la web y qué secciones funcionan mejor, de forma agregada.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Nombre<\/th>\n<th>Titular<\/th>\n<th>Finalidad<\/th>\n<th>Duración<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><mark class=\"pend\">[PENDIENTE: p. ej. <code>_ga<\/code>, <code>_ga_*<\/code>]<\/mark><\/td>\n<td><mark class=\"pend\">[PENDIENTE: p. ej. Google Analytics]<\/mark><\/td>\n<td>Estadísticas de uso<\/td>\n<td>Según el proveedor<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<h3>Publicitarias (solo si las aceptas)<\/h3>\n<p>Permiten medir la eficacia de nuestros anuncios y mostrarte anuncios relevantes en otras plataformas.<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Nombre<\/th>\n<th>Titular<\/th>\n<th>Finalidad<\/th>\n<th>Duración<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td><mark class=\"pend\">[PENDIENTE: p. ej. <code>_fbp<\/code>]<\/mark><\/td>\n<td><mark class=\"pend\">[PENDIENTE: p. ej. Meta Platforms]<\/mark><\/td>\n<td>Medición y publicidad en Facebook e Instagram<\/td>\n<td>Según el proveedor<\/td>\n<\/tr>\n<tr>\n<td><mark class=\"pend\">[PENDIENTE: otras, p. ej. TikTok Pixel]<\/mark><\/td>\n<td><mark class=\"pend\">[PENDIENTE]<\/mark><\/td>\n<td>Medición y publicidad<\/td>\n<td>Según el proveedor<\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>Mientras no aceptes las cookies analíticas o publicitarias, no se cargan.<\/strong><\/p>\n<h2>3. Cómo dar o retirar tu consentimiento<\/h2>\n<ul>\n<li>Al entrar en la web te mostramos un aviso con tres opciones de la misma importancia: <strong>Aceptar todas<\/strong>,\n<strong>Rechazar<\/strong> y <strong>Configurar<\/strong>.<\/li>\n<li>Puedes cambiar tu elección cuando quieras desde el enlace <strong>«Configurar cookies»<\/strong> del pie de página.<\/li>\n<li>También puedes borrar o bloquear las cookies desde la configuración de tu navegador. Si bloqueas las técnicas, puede\nque la web o la app no funcionen bien.<\/li>\n<\/ul>\n<h2>4. Transferencias internacionales<\/h2>\n<p>Algunos proveedores de cookies analíticas o publicitarias pueden tratar datos fuera del Espacio Económico Europeo.\nConsulta la <a href=\"#legal-privacidad\">Política de privacidad<\/a>, apartado 5.<\/p>\n<h2>5. Más información<\/h2>\n<p>Para cualquier duda sobre esta política, escríbenos a <mark class=\"pend\">[PENDIENTE: e-mail de privacidad]<\/mark>.<\/p>\n"},"encargo":{"title":"Acuerdo de encargo del tratamiento","html":"<p><em>Última actualización: <mark class=\"pend\">[PENDIENTE: fecha de publicación]<\/mark><\/em><\/p>\n<p>Este acuerdo forma parte de las <a href=\"#legal-condiciones\">Condiciones de uso<\/a> y regula el tratamiento de datos personales que\nLOOSES &amp; WINS realiza por cuenta del cliente, conforme al artículo 28 del Reglamento (UE) 2016/679 (RGPD) y a la Ley\nOrgánica 3/2018 (LOPDGDD).<\/p>\n<h2>1. Partes<\/h2>\n<ul>\n<li><strong>Responsable del tratamiento:<\/strong> el cliente titular de la cuenta («el Cliente»).<\/li>\n<li><strong>Encargado del tratamiento:<\/strong> <mark class=\"pend\">[PENDIENTE: titular, NIF y domicilio]<\/mark> («LOOSES &amp; WINS»).<\/li>\n<\/ul>\n<h2>2. Objeto, naturaleza y finalidad<\/h2>\n<p>LOOSES &amp; WINS trata los datos necesarios para prestar el Servicio: importar, almacenar, cruzar y analizar la\ninformación del negocio del Cliente (pedidos, reembolsos, costes, gastos, anuncios, movimientos de pago y bancarios,\nfacturas) para calcular su beneficio, preparar informes y mostrarlos en la app.<\/p>\n<h2>3. Tipos de datos y categorías de interesados<\/h2>\n<ul>\n<li><strong>Clientes finales de la tienda del Cliente:<\/strong> datos mínimos de los pedidos (número de pedido, importes, productos,\nfechas, estado, país de envío y facturación). LOOSES &amp; WINS no necesita ni guarda nombres, e-mails, teléfonos ni\ndirecciones completas de los clientes finales <mark class=\"pend\">[PENDIENTE: confirmar que ninguna integración los guarda]<\/mark>.<\/li>\n<li><strong>Usuarios del Cliente<\/strong> (socios, empleados, gestor): nombre, e-mail y registros de actividad.<\/li>\n<li><strong>Proveedores y contrapartes<\/strong> del Cliente: nombres o razones sociales e importes que aparezcan en facturas,\nmovimientos bancarios o de pago.<\/li>\n<\/ul>\n<p>No se tratan categorías especiales de datos.<\/p>\n<h2>4. Duración<\/h2>\n<p>Mientras la cuenta del Cliente esté activa y, tras la baja, durante el plazo de conservación indicado en el apartado 11.<\/p>\n<h2>5. Obligaciones de LOOSES &amp; WINS<\/h2>\n<p>LOOSES &amp; WINS se compromete a:<\/p>\n<ol>\n<li>Tratar los datos <strong>solo siguiendo las instrucciones documentadas del Cliente<\/strong>, que son las que resultan del uso del\nServicio y de estas condiciones. Si considera que una instrucción infringe la normativa, informará al Cliente.<\/li>\n<li>No usar los datos para fines propios, salvo estadísticas <strong>agregadas y anónimas<\/strong> que no permitan identificar al\nCliente ni a los interesados.<\/li>\n<li>Garantizar que las personas autorizadas a tratar los datos se han comprometido a respetar la <strong>confidencialidad<\/strong>.\nEl personal de LOOSES &amp; WINS solo accede a la información de negocio de una cuenta para dar soporte a petición del\nCliente, y cada acceso queda registrado y visible para el Cliente.<\/li>\n<li>Aplicar las <strong>medidas de seguridad<\/strong> del apartado 6.<\/li>\n<li>Respetar las condiciones del apartado 7 para recurrir a <strong>subencargados<\/strong>.<\/li>\n<li>Ayudar al Cliente, en la medida de lo posible, a atender las solicitudes de <strong>ejercicio de derechos<\/strong> de los\ninteresados.<\/li>\n<li>Ayudar al Cliente a cumplir sus obligaciones de seguridad, notificación de brechas y, en su caso, evaluaciones de\nimpacto.<\/li>\n<li><strong>Notificar al Cliente las violaciones de seguridad<\/strong> de los datos sin dilación indebida y, en todo caso, en un plazo\nmáximo de <strong>48 horas<\/strong> desde que tenga constancia, con la información disponible.<\/li>\n<li>Al terminar el servicio, <strong>suprimir o devolver<\/strong> los datos según el apartado 11.<\/li>\n<li>Poner a disposición del Cliente la información necesaria para demostrar el cumplimiento de este acuerdo y permitir\nauditorías razonables, con preaviso y sin acceso a datos de otros clientes.<\/li>\n<\/ol>\n<h2>6. Medidas de seguridad<\/h2>\n<ul>\n<li>Cifrado de las comunicaciones (HTTPS/TLS).<\/li>\n<li>Cifrado de las claves y tokens de conexión con servicios de terceros.<\/li>\n<li>Separación de los datos de cada cliente y control de accesos por cuenta y rol.<\/li>\n<li>Verificación en dos pasos disponible para los usuarios.<\/li>\n<li>Copias de seguridad periódicas.<\/li>\n<li>Registros de actividad y de accesos de soporte.<\/li>\n<li><mark class=\"pend\">[PENDIENTE: completar con las medidas definitivas de la versión multicliente.]<\/mark><\/li>\n<\/ul>\n<h2>7. Subencargados<\/h2>\n<p>El Cliente autoriza a LOOSES &amp; WINS a recurrir a los siguientes subencargados:<\/p>\n<div class=\"tbl\"><table>\n<thead>\n<tr>\n<th>Subencargado<\/th>\n<th>Servicio<\/th>\n<th>Ubicación<\/th>\n<\/tr>\n<\/thead>\n<tbody><tr>\n<td>Supabase<\/td>\n<td>Base de datos, autenticación, almacenamiento y funciones del servidor<\/td>\n<td><mark class=\"pend\">[PENDIENTE: región, p. ej. UE – Fráncfort]<\/mark><\/td>\n<\/tr>\n<tr>\n<td><mark class=\"pend\">[PENDIENTE: hosting de la web]<\/mark><\/td>\n<td>Alojamiento de la web y la app<\/td>\n<td><mark class=\"pend\">[PENDIENTE]<\/mark><\/td>\n<\/tr>\n<tr>\n<td>Anthropic<\/td>\n<td>Asistente IA (solo si el Cliente lo usa)<\/td>\n<td>EE. UU.<\/td>\n<\/tr>\n<tr>\n<td><mark class=\"pend\">[PENDIENTE: proveedor de e-mail]<\/mark><\/td>\n<td>Envío de e-mails transaccionales y avisos<\/td>\n<td><mark class=\"pend\">[PENDIENTE]<\/mark><\/td>\n<\/tr>\n<\/tbody><\/table><\/div>\n<p>LOOSES &amp; WINS informará al Cliente, con al menos <strong>30 días<\/strong> de antelación, de cualquier cambio en los subencargados. El\nCliente podrá oponerse y, si no se llega a un acuerdo, cancelar el Servicio. LOOSES &amp; WINS impondrá a cada subencargado\nlas mismas obligaciones de protección de datos.<\/p>\n<p>Los servicios que el Cliente conecta por su cuenta (por ejemplo, Shopify, plataformas de anuncios, pasarelas de pago,\nbancos, su proveedor o su Google Drive) no son subencargados de LOOSES &amp; WINS: son proveedores del propio Cliente y el\nacceso se hace con su autorización.<\/p>\n<h2>8. Transferencias internacionales<\/h2>\n<p>Cuando un subencargado trate datos fuera del Espacio Económico Europeo, la transferencia se ampara en el Marco de\nPrivacidad de Datos UE-EE. UU. o en las cláusulas contractuales tipo de la Comisión Europea.<\/p>\n<h2>9. Ejercicio de derechos<\/h2>\n<p>Si un interesado se dirige a LOOSES &amp; WINS para ejercer sus derechos sobre datos tratados por cuenta del Cliente,\nLOOSES &amp; WINS lo trasladará al Cliente sin demora para que lo resuelva.<\/p>\n<h2>10. Obligaciones del Cliente<\/h2>\n<p>El Cliente garantiza que tiene base legal para tratar los datos que incorpora al Servicio, que ha informado a los\ninteresados y que las instrucciones que da son lícitas.<\/p>\n<h2>11. Fin del servicio: devolución o supresión<\/h2>\n<ul>\n<li><strong>Baja normal:<\/strong> tras la cancelación, LOOSES &amp; WINS conserva los datos durante <strong>dos meses<\/strong>. En ese plazo el Cliente\npuede reactivar la cuenta o solicitar la <strong>exportación<\/strong> de sus datos. Pasado el plazo, los datos se suprimen.<\/li>\n<li><strong>Impago:<\/strong> pasados 30 días desde un impago sin regularizar, el Cliente <strong>elige desde ahora la supresión de los\ndatos<\/strong>, en los términos de la <a href=\"#legal-pagos\">Política de pagos y contracargos<\/a>, apartado 3.<\/li>\n<li><strong>Contracargo sin contacto previo:<\/strong> el Cliente <strong>elige desde ahora la supresión de los datos, sin devolución<\/strong>, en los\ntérminos de la <a href=\"#legal-pagos\">Política de pagos y contracargos<\/a>.<\/li>\n<li>En ambos casos, LOOSES &amp; WINS podrá conservar, bloqueados, los datos necesarios para cumplir obligaciones legales o\npara la defensa frente a reclamaciones, durante los plazos de prescripción.<\/li>\n<\/ul>\n"}}</script>

        if (modalStack[modalStack.length - 1] !== me) return;

        var list = Array.prototype.filter.call(ref.current.querySelectorAll('a[href], button:not([disabled]), input:not([disabled]), select, textarea'), function (el) { return el.offsetParent !== null; });

      return function () {
        modalStack.splice(modalStack.indexOf(me), 1);
        if (!modalStack.length) document.body.classList.remove('locked');
