          ${LEGAL_ORDER.map(function (s) { return html`<button key=${s[0]} type="button" className=${s[0] === props.doc ? 'on' : ''} aria-current=${s[0] === props.doc ? 'page' : undefined} onClick=${function () { props.onNav(s[0]); }}>${s[1]}</button>`; })}
        </nav>
        <article className="legal-doc" ref=${body}>
          <h2>${d.title}</h2>
          <p className="draft">Borrador pendiente de revisión legal. Los datos marcados como pendientes se completarán antes de publicar.</p>
          <div className="legal-body" dangerouslySetInnerHTML=${{ __html: d.html }}></div>
        </article>
      </div>
    </div>`;
  }

  /* ---------- cookies ---------- */
  function CookieBanner(props) {
    var c = props.current || { a: false, p: false };
    var s = useState(props.mode === 'config'), cfg = s[0], setCfg = s[1];
    var sa = useState(!!c.a), an = sa[0], setAn = sa[1];
    var sp = useState(!!c.p), ad = sp[0], setAd = sp[1];
    return html`<div className="cookie" role="dialog" aria-label="Preferencias de cookies">
      <p><b>Usamos cookies.</b> Las técnicas son necesarias para que la web funcione. Si nos dejas, usaremos también cookies de análisis y de publicidad para medir y mejorar nuestros anuncios. <a href="#legal-cookies">Política de cookies</a></p>
      ${cfg && html`<div className="cookie-opts">
        <label className="tgl"><span><b>Técnicas</b><small>Necesarias. Siempre activas.</small></span><input type="checkbox" checked=${true} disabled=${true} /></label>
        <label className="tgl"><span><b>Análisis</b><small>Estadísticas de visitas.</small></span><input type="checkbox" checked=${an} onChange=${function (e) { setAn(e.target.checked); }} /></label>
        <label className="tgl"><span><b>Publicidad</b><small>Medir nuestros anuncios en otras plataformas.</small></span><input type="checkbox" checked=${ad} onChange=${function (e) { setAd(e.target.checked); }} /></label>
      </div>`}
      <div className="cookie-btns">
        <button className="btn btn-dark btn-sm" type="button" onClick=${function () { props.onSave({ a: false, p: false }); }}>Rechazar</button>
        ${cfg ? html`<button className="btn btn-soft btn-sm" type="button" onClick=${function () { props.onSave({ a: an, p: ad }); }}>Guardar selección</button>`
              : html`<button className="btn btn-soft btn-sm" type="button" onClick=${function () { setCfg(true); }}>Configurar</button>`}
        <button className="btn btn-dark btn-sm" type="button" onClick=${function () { props.onSave({ a: true, p: true }); }}>Aceptar todas</button>
      </div>
    </div>`;
  }

  /* Analytics and ad pixels load only after consent. Nothing is loaded yet: add the real snippets here. */
  function applyConsent(c) {
    if (c.a) { /* [PENDIENTE] cargar la analítica (p. ej. Google Analytics) */ }
    if (c.p) { /* [PENDIENTE] cargar los píxeles de publicidad (p. ej. Meta, TikTok) */ }
  }

  /* ---------- calculator ---------- */
  function num(x) {
    x = String(x).trim();
    if (x.indexOf(',') >= 0) x = x.replace(/\./g, '').replace(',', '.');
    else if (!/^\d+\.\d{1,2}$/.test(x)) x = x.replace(/\./g, '');
    var n = parseFloat(x);
    return isFinite(n) && n > 0 ? n : 0;
  }
  var dec2 = new Intl.NumberFormat('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 });

  function Calc(props) {
    var s = useState({ ticket: '49,90', product: '12,35', cpa: '21,40', fee: '3', fx: '1,2', loss: '2,5', fixed: '1.200', orders: '600' }), v = s[0], setV = s[1];
    function up(k, val) { setV(function (o) { var n = Object.assign({}, o); n[k] = val; return n; }); }
    var t = num(v.ticket), pr = num(v.product), cpa = num(v.cpa), orders = num(v.orders);
    var fee = t * num(v.fee) / 100, fx = t * num(v.fx) / 100, loss = t * num(v.loss) / 100, fixedPer = orders ? num(v.fixed) / orders : 0;
    var apparent = r2(t - pr - cpa);
    var real = r2(apparent - fee - fx - loss - fixedPer);
    var hidden = Math.round((apparent - real) * orders);
    var contrib = t - pr - fee - fx - loss - fixedPer;
    var be = contrib > 0 ? r2(t / contrib) : null, roas = cpa > 0 ? r2(t / cpa) : null;
    var wins = real > 0;
    var fields = [
      ['ticket', 'Ticket medio', '€'], ['product', 'Producto y envío', '€'], ['cpa', 'Coste por compra en anuncios', '€'], ['fee', 'Comisión de la pasarela', '%'],
      ['fx', 'Cambio de divisa', '%'], ['loss', 'Reembolsos y contracargos', '%'], ['fixed', 'Gastos fijos al mes', '€'], ['orders', 'Pedidos al mes', '']
    ];
    return html`<section className="section pt0" id="calculadora">
      <div className="wrap">
        <div className="head reveal"><span className="chip"><i></i>Calculadora</span><h2>Calcula lo que no estás viendo.</h2><p>Pon tus números. En 10 segundos sabes cuánto te queda de verdad por pedido.</p></div>
        <div className="card calc reveal">
          <div className="calc-in">
            ${fields.map(function (f) {
              return html`<div className="fld" key=${f[0]}><label htmlFor=${'c-' + f[0]}>${f[1]}</label><div className="sfx"><input id=${'c-' + f[0]} type="text" inputMode="decimal" value=${v[f[0]]} onInput=${function (e) { up(f[0], e.target.value); }} />${f[2] && html`<span>${f[2]}</span>`}</div></div>`;
            })}
            <p className="note" style=${{ gridColumn: '1 / -1' }}>Valores de ejemplo: cámbialos por los tuyos.</p>
          </div>
          <div className="calc-out">
            <div className="co-row"><span>Lo que crees que ganas por pedido</span><${Roll} value=${apparent}>${eurNum(apparent, 2)}<//></div>
            <div className="co-main"><span>Lo que te queda de verdad</span><${Roll} value=${real} className=${wins ? 'pos' : 'neg'}>${eurNum(real, 2)}<//></div>
            <div className="co-row warn"><span>Lo que no estabas viendo, al mes</span><${Roll} value=${hidden}>${eurNum(-hidden, 0)}<//></div>
            <div className="co-roas">
              <div><small>Tu ROAS</small><${Roll} value=${roas || 0}>${roas ? dec2.format(roas) : '—'}<//></div>
              <div><small>Tu ROAS de equilibrio</small><${Roll} value=${be || 0}>${be ? dec2.format(be) : '—'}<//></div>
              <span className=${'badge ' + (wins ? 'g' : 'r')}>${wins ? 'Ganas dinero' : 'Pierdes dinero'}</span>
            </div>
            <button className="btn btn-primary" type="button" onClick=${props.onFree}>Ver mis números reales gratis</button>
            <p className="note">Cálculo orientativo con los datos que pongas. La app lo calcula con tus pedidos reales, uno a uno.</p>
          </div>
        </div>
      </div>
    </section>`;
  }

  /* ---------- comparison ---------- */
  function Mark(props) {
    var icon = props.k === 'yes' ? '✓' : props.k === 'mid' ? '~' : '✕';
    return html`<span className=${'mk mk-' + props.k}><i aria-hidden="true">${icon}</i><span>${props.t}</span></span>`;
  }
  function Compare() {
    var rows = [
      ['Se actualiza solo', ['no', 'A mano'], ['yes', 'Sí'], ['yes', 'Cada hora']],
      ['Coste real del proveedor en cada pedido', ['mid', 'Si lo copias'], ['mid', 'Coste fijo por producto'], ['yes', 'El de cada pedido']],
      ['Contracargos, comisiones y divisas', ['no', 'Casi nunca'], ['mid', 'A veces'], ['yes', 'Con su coste real']],
      ['Facturas, IVA/OSS y cierre de mes', ['no', 'Otro archivo'], ['no', 'Normalmente no'], ['yes', 'Incluido']],
      ['ROAS de equilibrio', ['mid', 'A mano'], ['mid', 'A veces'], ['yes', 'Cada día']],
      ['Pensado para España y la UE', ['no', 'No'], ['mid', 'Suelen ser de EE. UU.'], ['yes', 'IVA, OSS y BCE']]
    ];
    return html`<section className="section pt0" id="comparacion">
      <div className="wrap">
        <div className="head reveal"><span className="chip"><i></i>Comparación</span><h2>Lo que cambia frente a lo que usas hoy.</h2></div>
        <div className="cmp reveal" role="table" aria-label="Comparación">
          <div className="cmp-row cmp-h" role="row">
            <span role="columnheader" className="cmp-t"></span>
            <span role="columnheader">Tu Excel</span>
            <span role="columnheader">Otras apps</span>
            <span role="columnheader" className="us"><span className="logo-mark sm" aria-hidden="true">L&W</span><span className="us-name">LOOSES & WINS</span></span>
          </div>
          ${rows.map(function (r) {
            return html`<div className="cmp-row" role="row" key=${r[0]}>
              <span role="rowheader" className="cmp-t">${r[0]}</span>
              <span role="cell"><${Mark} k=${r[1][0]} t=${r[1][1]} /></span>
              <span role="cell"><${Mark} k=${r[2][0]} t=${r[2][1]} /></span>
              <span role="cell" className="us"><${Mark} k=${r[3][0]} t=${r[3][1]} /></span>
            </div>`;
          })}
        </div>
      </div>
    </section>`;
  }

  function App() {
    var saved = 'y';
    try { saved = localStorage.getItem('lw-period2') === 'm' ? 'm' : 'y'; } catch (e) {}
    var ps = useState(saved), period = ps[0], setPeriodRaw = ps[1];
    var cs = useState(null), checkout = cs[0], setCheckout = cs[1];
    var qs = useState(false), quote = qs[0], setQuote = qs[1];
    function setPeriod(p) { setPeriodRaw(p); try { localStorage.setItem('lw-period2', p); } catch (e) {} }
    function openPlan(plan) { setCheckout({ plan: plan, k: Date.now() }); }
    function onFree() { openPlan('free'); }
    function onQuote() { setQuote(true); }
    var ls = useState(null), legal = ls[0], setLegal = ls[1];
    var stored = null;
    try { stored = JSON.parse(localStorage.getItem('lw-consent') || 'null'); } catch (e) {}
    var ks = useState(stored), consent = ks[0], setConsent = ks[1];
    var bs = useState(stored ? null : 'banner'), cookieMode = bs[0], setCookieMode = bs[1];
    function saveConsent(c) {
      var v = { a: !!c.a, p: !!c.p, t: Date.now() };
      setConsent(v); setCookieMode(null);
      try { localStorage.setItem('lw-consent', JSON.stringify(v)); } catch (e) {}
      applyConsent(v);
    }
    useEffect(function () { if (stored) applyConsent(stored); }, []);

    /* Any link to #legal-<doc> opens the legal viewer instead of navigating */
    useEffect(function () {
      function click(e) {
        var a = e.target.closest && e.target.closest('a[href^="#legal-"]');
        if (!a) return;
        e.preventDefault();
        setLegal(a.getAttribute('href').slice(7));
      }
      document.addEventListener('click', click);
      // opened from the app with #legal-<doc>
      if (/^#legal-/.test(window.location.hash)) setLegal(window.location.hash.slice(7));
      return function () { document.removeEventListener('click', click); };
    }, []);

    /* Card spotlight follows the pointer (mouse only) */
    useEffect(function () {
      if (!FINE) return;
      function move(e) {
        var c = e.target.closest && e.target.closest('.spot'); if (!c) return;
        var r = c.getBoundingClientRect();
        c.style.setProperty('--mx', (e.clientX - r.left) + 'px'); c.style.setProperty('--my', (e.clientY - r.top) + 'px');
      }
      document.addEventListener('pointermove', move, { passive: true });
      return function () { document.removeEventListener('pointermove', move); };
    }, []);

    return html`<${React.Fragment}>
      <${Nav} onFree=${onFree} />
      <main id="inicio">
        <${Hero} onFree=${onFree} />
        <${Pain} onFree=${onFree} />
        <${Loss} onFree=${onFree} />
        <${Calc} onFree=${onFree} />
        <${How} onFree=${onFree} />
        <${Features} />
        <${Compare} />
        <${Privacy} />
        <${BeforeAfter} />
        <${Founder} />
        <${Pricing} period=${period} setPeriod=${setPeriod} onBuy=${openPlan} onFree=${onFree} onQuote=${onQuote} />
        <${Loyalty} />
        <${Faq} onFree=${onFree} />
        <${Closing} onFree=${onFree} />
      </main>
      <footer>
        <div className="wrap foot">
          <div className="foot-brand">
            <a className="logo" href="#inicio"><span className="logo-mark" aria-hidden="true">L&W</span><span>LOOSES & WINS</span></a>
            <p>Contabilidad y beneficio real para tiendas de dropshipping.</p>
            <button className="btn btn-primary btn-sm" type="button" onClick=${onFree}>Empieza gratis</button>
          </div>
          <nav className="foot-col" aria-label="Producto">
            <h4>Producto</h4>
            <a href="#como">Cómo funciona</a><a href="#calculadora">Calculadora</a><a href="#funciones">Funciones</a><a href="#precios">Precios</a>
            <button type="button" className="foot-btn" onClick=${onQuote}>Enterprise</button>
          </nav>
          <nav className="foot-col" aria-label="Legal">
            <h4>Legal</h4>
            <a href="#legal-aviso">Aviso legal</a><a href="#legal-condiciones">Condiciones de uso</a><a href="#legal-devoluciones">Política de devoluciones</a><a href="#legal-pagos">Pagos y contracargos</a>
          </nav>
          <nav className="foot-col" aria-label="Privacidad">
            <h4>Privacidad</h4>
            <a href="#legal-privacidad">Política de privacidad</a><a href="#legal-cookies">Política de cookies</a><a href="#legal-encargo">Encargo del tratamiento</a>
            <button type="button" className="foot-btn" onClick=${function () { setCookieMode('config'); }}>Configurar cookies</button>
          </nav>
        </div>
        <div className="wrap foot-bottom"><span>© 2026 LOOSES & WINS. Todos los derechos reservados.</span><span>Las cifras de esta web son ejemplos ilustrativos.</span></div>
      </footer>
      <${MobileCta} onFree=${onFree} hidden=${!!checkout || quote || !!cookieMode} />
      ${checkout && html`<${Checkout} key=${checkout.k} plan=${checkout.plan} period=${period} onClose=${function () { setCheckout(null); }} />`}
      ${quote && html`<${Quote} onClose=${function () { setQuote(false); }} />`}
      ${cookieMode && html`<${CookieBanner} key=${cookieMode} mode=${cookieMode} current=${consent} onSave=${saveConsent} />`}
      ${legal && html`<${LegalViewer} doc=${legal} onNav=${setLegal} onClose=${function () { setLegal(null); }} />`}
    <//>`;
  }

  function boot() { ReactDOM.createRoot(document.getElementById('root')).render(h(App)); }
  if (API_URL && window.fetch) {
    var booted = false, guard = setTimeout(function () { if (!booted) { booted = true; boot(); } }, 2500);
    fetch(API_URL).then(function (r) { return r.json(); })
      .then(function (d) { if (!booted) { applyLive(d); booted = true; clearTimeout(guard); boot(); } })
      .catch(function () { if (!booted) { booted = true; clearTimeout(guard); boot(); } });
  } else boot();
})();
</script>

</body></html>
